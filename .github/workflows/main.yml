name: Build Android APK with Home Screen Widgets

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Prepare Resources & Build APK
        run: |
          ANDROID_DIR="New folder/New folder/native_mobile/android"
          if [ ! -d "$ANDROID_DIR" ]; then
            ANDROID_DIR="native_mobile/android"
          fi
          
          echo "Using Android directory: $ANDROID_DIR"
          cd "$ANDROID_DIR"

          RES_DIR="app/src/main/res"
          mkdir -p "$RES_DIR/drawable"
          mkdir -p "$RES_DIR/mipmap-hdpi" "$RES_DIR/mipmap-mdpi" "$RES_DIR/mipmap-xhdpi" "$RES_DIR/mipmap-xxhdpi" "$RES_DIR/mipmap-xxxhdpi"

          cat << 'EOF' > "$RES_DIR/drawable/widget_background_dark.xml"
<?xml version="1.0" encoding="utf-8"?>
<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
    <solid android:color="#1A1F2C" />
    <corners android:radius="16dp" />
    <stroke android:width="1dp" android:color="#334155" />
</shape>
EOF

          cat << 'EOF' > "$RES_DIR/drawable/ic_check_circle.xml"
<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
  <path android:fillColor="#10B981" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM10,17l-5,-5 1.41,-1.41L10,14.17l7.59,-7.59L19,8l-9,9z"/>
</vector>
EOF

          cat << 'EOF' > "$RES_DIR/drawable/ic_circle_outline.xml"
<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
  <path android:fillColor="#475569" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM12,20c-4.42,0 -8,-3.58 -8,-8s3.58,-8 8,-8 8,3.58 8,8 -3.58,8 -8,8z"/>
</vector>
EOF

          RECEIVER_FILE="app/src/main/java/com/habittracker/widget/WidgetActionReceiver.kt"
          if [ -f "$RECEIVER_FILE" ] && grep -q "AppDatabase" "$RECEIVER_FILE"; then
            cat << 'EOF' > "$RECEIVER_FILE"
package com.habittracker.widget

import android.appwidget.AppWidgetManager
import android.content.BroadcastReceiver
import android.content.ComponentName
import android.content.Context
import android.content.Intent
import com.habittracker.data.WidgetDataHelper

class WidgetActionReceiver : BroadcastReceiver() {
    override fun onReceive(context: Context, intent: Intent) {
        if (intent.action == ACTION_TOGGLE_HABIT) {
            val logId = intent.getStringExtra(EXTRA_LOG_ID) ?: return
            WidgetDataHelper.toggleHabit(context, logId)
            val appWidgetManager = AppWidgetManager.getInstance(context)
            val componentName = ComponentName(context, HabitWidgetProvider::class.java)
            val ids = appWidgetManager.getAppWidgetIds(componentName)
            for (id in ids) {
                HabitWidgetProvider.updateAppWidget(context, appWidgetManager, id)
            }
        }
    }
    companion object {
        const val ACTION_TOGGLE_HABIT = "com.habittracker.ACTION_TOGjekt.ACTION_TOGGLE_HABIT"
        const val EXTRA_LOG_ID = "com.habittracker.EXTRA_LOG_ID"
    }
}
EOF
          fi

          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi

          chmod +x gradlew
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          ./gradlew assembleDebug --stacktrace

      - name: Upload HabitTrack APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitTrack-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
