name: Build Android APK with Home Screen Widgets

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          cache-disabled: true

      - name: Build Android APK
        run: |
          # 1. Unpack HabitTrack_Updated.zip if present
          if [ -f "HabitTrack_Updated.zip" ]; then
            echo "Unpacking HabitTrack_Updated.zip..."
            mkdir -p /tmp/fresh_app
            unzip -o HabitTrack_Updated.zip -d /tmp/fresh_app
            cp -rf /tmp/fresh_app/* .
          fi

          # 2. Remove old duplicate folders so they are not built by mistake
          rm -rf "New folder/New folder/native_mobile" 2>/dev/null || true
          rm -rf "New folder/native_mobile" 2>/dev/null || true

          # 3. Locate the Android project
          TARGET=$(find . -name "settings.gradle" -not -path "*/build/*" | head -n 1)
          if [ -z "$TARGET" ]; then
            echo "settings.gradle not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$TARGET")
          echo "Building fresh Android project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 4. Enable AndroidX
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties

          # 5. Clean and Build APK
          gradle clean assembleDebug --stacktrace

      - name: Upload HabitTrack APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitTrack-v2-APK
          path: "**/app/build/outputs/apk/**/*.apk"
          if-no-files-found: error
