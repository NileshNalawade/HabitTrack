name: Build Android APK with Home Screen Widgets

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          cache-disabled: true

      - name: Build Android APK
        run: |
          # 1. Unpack any zip if uploaded
          find . -name "*.zip" -exec unzip -o {} \; 2>/dev/null || true

          # 2. Locate Android project
          TARGET=$(find . -name "settings.gradle" -not -path "*/build/*" | head -n 1)
          if [ -z "$TARGET" ]; then
            echo "settings.gradle not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$TARGET")
          echo "Found Android project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 3. Enable AndroidX
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties

          # 4. Build APK
          gradle assembleDebug --stacktrace

      - name: Upload HabitTrack APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitTrack-APK
          path: "**/app/build/outputs/apk/**/*.apk"
          if-no-files-found: error
