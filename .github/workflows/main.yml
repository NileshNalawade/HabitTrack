name: Build Android APK with Home Screen Widgets

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Prepare Resources & Build APK
        run: |
          python3 -c '
          import os, subprocess

          android_dir = None
          for root, dirs, files in os.walk("."):
              if "settings.gradle" in files and ".git" not in root:
                  android_dir = root
                  break

          if not android_dir:
              android_dir = "native_mobile/android"

          print(f"Target Android directory: {android_dir}")

          res_dir = os.path.join(android_dir, "app/src/main/res")
          os.makedirs(os.path.join(res_dir, "drawable"), exist_ok=True)
          for density in ["hdpi", "mdpi", "xhdpi", "xxhdpi", "xxxhdpi"]:
              os.makedirs(os.path.join(res_dir, f"mipmap-{density}"), exist_ok=True)

          with open(os.path.join(res_dir, "drawable/widget_background_dark.xml"), "w") as f:
              f.write("""<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<shape xmlns:android=\"http://schemas.android.com/apk/res/android\" android:shape=\"rectangle\">\n    <solid android:color=\"#1A1F2C\" />\n    <corners android:radius=\"16dp\" />\n    <stroke android:width=\"1dp\" android:color=\"#334155\" />\n</shape>""")

          with open(os.path.join(res_dir, "drawable/ic_check_circle.xml"), "w") as f:
              f.write("""<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<vector xmlns:android=\"http://schemas.android.com/apk/res/android\" android:width=\"24dp\" android:height=\"24dp\" android:viewportWidth=\"24\" android:viewportHeight=\"24\">\n  <path android:fillColor=\"#10B981\" android:pathData=\"M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM10,17l-5,-5 1.41,-1.41L10,14.17l7.59,-7.59L19,8l-9,9z\"/>\n</vector>""")

          with open(os.path.join(res_dir, "drawable/ic_circle_outline.xml"), "w") as f:
              f.write("""<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<vector xmlns:android=\"http://schemas.android.com/apk/res/android\" android:width=\"24dp\" android:height=\"24dp\" android:viewportWidth=\"24\" android:viewportHeight=\"24\">\n  <path android:fillColor=\"#475569\" android:pathData=\"M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM12,20c-4.42,0 -8,-3.58 -8,-8s3.58,-8 8,-8 8,3.58 8,8 -3.58,8 -8,8z\"/>\n</vector>""")

          receiver_file = os.path.join(android_dir, "app/src/main/java/com/habittracker/widget/WidgetActionReceiver.kt")
          if os.path.exists(receiver_file):
              with open(receiver_file, "r") as f:
                  content = f.read()
              if "AppDatabase" in content:
                  with open(receiver_file, "w") as f:
                      f.write("""package com.habittracker.widget\n\nimport android.appwidget.AppWidgetManager\nimport android.content.BroadcastReceiver\nimport android.content.ComponentName\nimport android.content.Context\nimport android.content.Intent\nimport com.habittracker.data.WidgetDataHelper\n\nclass WidgetActionReceiver : BroadcastReceiver() {\n    override fun onReceive(context: Context, intent: Intent) {\n        if (intent.action == ACTION_TOGGLE_HABIT) {\n            val logId = intent.getStringExtra(EXTRA_LOG_ID) ?: return\n            WidgetDataHelper.toggleHabit(context, logId)\n            val appWidgetManager = AppWidgetManager.getInstance(context)\n            val componentName = ComponentName(context, HabitWidgetProvider::class.java)\n            val ids = appWidgetManager.getAppWidgetIds(componentName)\n            for (id in ids) {\n                HabitWidgetProvider.updateAppWidget(context, appWidgetManager, id)\n            }\n        }\n    }\n    companion object {\n        const val ACTION_TOGGLE_HABIT = \"com.habittracker.ACTION_TOGGLE_HABIT\"\n        const val EXTRA_LOG_ID = \"com.habittracker.EXTRA_LOG_ID\"\n    }\n}""")

          gradlew_path = os.path.join(android_dir, "gradlew")
          if not os.path.exists(gradlew_path):
              subprocess.run(["gradle", "wrapper"], cwd=android_dir, check=True)

          os.chmod(gradlew_path, 0o755)

          env = os.environ.copy()
          env["ANDROID_HOME"] = env.get("ANDROID_SDK_ROOT", "")
          
          # Build assembleDebug or assembleRelease with debug signing fallback
          subprocess.run(["./gradlew", "assembleDebug", "--stacktrace"], cwd=android_dir, env=env, check=True)
          '

      - name: Upload HabitTrack APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitTrack-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
