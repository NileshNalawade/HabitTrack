name: Build Android APK with Home Screen Widgets

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          cache-disabled: true

      - name: Build Android APK
        run: |
          # 1. Locate Android project
          TARGET=$(find . -name "settings.gradle" -not -path "*/build/*" | head -n 1)
          if [ -z "$TARGET" ]; then
            echo "settings.gradle not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$TARGET")
          echo "Found Android project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 2. Enable AndroidX in gradle.properties (fixes checkDebugAarMetadata)
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties

          # 3. Create missing resources
          RES="app/src/main/res"
          mkdir -p "$RES/drawable" "$RES/mipmap-hdpi"

          echo "" | base64 -d > "$RES/drawable/widget_background_dark.xml"
          echo "" | base64 -d > "$RES/drawable/ic_check_circle.xml"
          echo "" | base64 -d > "$RES/drawable/ic_circle_outline.xml"

          if [ ! -f "$RES/mipmap-hdpi/ic_launcher.png" ]; then
            echo "" | base64 -d > "$RES/drawable/ic_launcher.xml"
            sed -i 's/@mipmap\/ic_launcher/@drawable\/ic_launcher/g' app/src/main/AndroidManifest.xml
          fi

          REC="app/src/main/java/com/habittracker/widget/WidgetActionReceiver.kt"
          if grep -q "AppDatabase" "$REC" 2>/dev/null; then
            echo "" | base64 -d > "$REC"
          fi

          # 4. Build APK
          gradle assembleDebug --stacktrace

      - name: Upload HabitTrack APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitTrack-APK
          path: "**/app/build/outputs/apk/**/*.apk"
          if-no-files-found: error
