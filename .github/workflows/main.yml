name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Locate Android project and copy to a space-free build folder
        run: |
          set -e
          find_settings() {
            find . -name settings.gradle -not -path "*/build/*" -not -path "./.git/*" | head -n 1
          }

          SETTINGS_FILE=$(find_settings)

          # Fallback: a .zip was uploaded to the repo instead of the extracted folder.
          # Python is used because Windows-made zips use "\" separators that plain `unzip` mangles.
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle not found - trying to extract zip archives..."
            find . -name "*.zip" -not -path "./.git/*" | while read -r z; do
              python3 - "$z" <<'PY'
          import sys, zipfile, os
          z = zipfile.ZipFile(sys.argv[1])
          for i in z.infolist():
              p = i.filename.replace("\\", "/")
              if p.endswith("/"):
                  continue
              os.makedirs(os.path.dirname(p) or ".", exist_ok=True)
              with open(p, "wb") as f:
                  f.write(z.read(i))
          PY
            done
            SETTINGS_FILE=$(find_settings)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle not found. Upload the project folder contents (not only a .zip)."
            exit 1
          fi

          SRC_DIR=$(dirname "$SETTINGS_FILE")
          echo "Android project found at: $SRC_DIR"

          # Copy to a path without spaces (avoids AAPT2 path bugs); "/." also copies hidden files
          BUILD_DIR="$RUNNER_TEMP/android_build"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cp -a "$SRC_DIR"/. "$BUILD_DIR"/
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

          # Sync latest web app (repo root) into the Android assets, if present
          WEB_INDEX=$(find . -name index.html -not -path "*/assets/*" -not -path "*/build/*" -not -path "./.git/*" | head -n 1)
          if [ -n "$WEB_INDEX" ]; then
            WEB_ROOT=$(dirname "$WEB_INDEX")
            ASSET_DIR="$BUILD_DIR/app/src/main/assets"
            mkdir -p "$ASSET_DIR/js"
            cp -f "$WEB_ROOT/index.html" "$ASSET_DIR/"
            [ -f "$WEB_ROOT/manifest.json" ] && cp -f "$WEB_ROOT/manifest.json" "$ASSET_DIR/"
            [ -f "$WEB_ROOT/sw.js" ] && cp -f "$WEB_ROOT/sw.js" "$ASSET_DIR/"
            [ -d "$WEB_ROOT/css" ] && cp -rf "$WEB_ROOT/css" "$ASSET_DIR/"
            [ -d "$WEB_ROOT/icons" ] && cp -rf "$WEB_ROOT/icons" "$ASSET_DIR/"
            [ -f "$WEB_ROOT/js/bundle.js" ] && cp -f "$WEB_ROOT/js/bundle.js" "$ASSET_DIR/js/"
          fi

          # Build configuration
          echo "sdk.dir=$ANDROID_HOME" > "$BUILD_DIR/local.properties"
          touch "$BUILD_DIR/gradle.properties"
          grep -q "android.useAndroidX" "$BUILD_DIR/gradle.properties" || echo "android.useAndroidX=true" >> "$BUILD_DIR/gradle.properties"
          grep -q "org.gradle.jvmargs" "$BUILD_DIR/gradle.properties" || echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> "$BUILD_DIR/gradle.properties"

      - name: Build debug APK
        run: |
          cd "$BUILD_DIR"

          # The wrapper jar is not committed - use the installed Gradle 8.5 directly
          if [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          set +e
          $GRADLE_CMD assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/build.log"
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            {
              echo "## Gradle build failed"
              echo '```text'
              grep -E "(^e: |FAILURE:|What went wrong|error:|Exception)" "$RUNNER_TEMP/build.log" | head -n 40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$STATUS"
          fi

      - name: Upload HabitTrack APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitTrack-APK
          path: ${{ runner.temp }}/android_build/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
