name: Build Android APK with Home Screen Widgets

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          cache-disabled: true

      - name: Locate and Prepare Android Project
        run: |
          # 1. Locate settings.gradle first
          SETTINGS_FILE=$(find . -name "settings.gradle" -not -path "*/build/*" | head -n 1)

          # Only unpack zip if settings.gradle is not already directly in the repository
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle not found in repository, inspecting zip archives..."
            find . -name "*.zip" | while read -r zipfile; do
              echo "Unpacking $zipfile..."
              unzip -o "$zipfile" || true
            done
            SETTINGS_FILE=$(find . -name "settings.gradle" -not -path "*/build/*" | head -n 1)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project settings.gradle could not be found anywhere!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Found Android project at: $PROJECT_DIR"

          # 2. Clean up any loose .kt files or ghost res folders at the Android root
          rm -f "$PROJECT_DIR"/*.kt 2>/dev/null || true
          rm -rf "$PROJECT_DIR"/res 2>/dev/null || true

          # 3. Sanitize any legacy invalid attributes in styles.xml and old references
          for sfile in $(find "$PROJECT_DIR" -name "styles.xml"); do
            sed -i '/windowSoftInputMode/d' "$sfile" 2>/dev/null || true
          done

          REC="$PROJECT_DIR/app/src/main/java/com/habittracker/widget/WidgetActionReceiver.kt"
          if grep -q "AppDatabase" "$REC" 2>/dev/null; then
            echo "Sanitizing old AppDatabase reference in $REC..."
            sed -i '/AppDatabase/d' "$REC" 2>/dev/null || true
            sed -i '/ExcelSyncBridge/d' "$REC" 2>/dev/null || true
          fi

          # 4. Sync latest web assets into app assets
          for assetdir in $(find "$PROJECT_DIR" -type d -name "assets" -path "*/app/src/main/assets"); do
            echo "Injecting updated web assets into $assetdir..."
            WEB_DIR=$(find . -name "index.html" -not -path "*/assets/*" -not -path "*/build/*" | head -n 1)
            if [ -n "$WEB_DIR" ]; then
              SRC_DIR=$(dirname "$WEB_DIR")
              cp -f "$SRC_DIR/index.html" "$assetdir/index.html" 2>/dev/null || true
              [ -d "$SRC_DIR/css" ] && cp -rf "$SRC_DIR/css" "$assetdir/" 2>/dev/null || true
              [ -d "$SRC_DIR/js" ] && cp -rf "$SRC_DIR/js" "$assetdir/" 2>/dev/null || true
              [ -d "$SRC_DIR/icons" ] && cp -rf "$SRC_DIR/icons" "$assetdir/" 2>/dev/null || true
              [ -f "$SRC_DIR/manifest.json" ] && cp -f "$SRC_DIR/manifest.json" "$assetdir/" 2>/dev/null || true
            fi
          done

          # 5. Ensure gradle.properties configuration
          touch "$PROJECT_DIR/gradle.properties"
          grep -q "android.useAndroidX" "$PROJECT_DIR/gradle.properties" || echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          grep -q "android.enableJetifier" "$PROJECT_DIR/gradle.properties" || echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"
          grep -q "org.gradle.jvmargs" "$PROJECT_DIR/gradle.properties" || echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> "$PROJECT_DIR/gradle.properties"

      - name: Build Android APK with Gradle
        run: |
          cd "$PROJECT_DIR"

          # If gradle-wrapper.jar is missing from repo, generate it or fall back to gradle CLI directly
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar is missing from repo. Regenerating wrapper with Gradle 8.5..."
            gradle wrapper --gradle-version 8.5 2>/dev/null || true
          fi

          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x gradlew 2>/dev/null || true
            ./gradlew assembleDebug --stacktrace --no-daemon --console=plain
          else
            echo "Running assembleDebug directly with system Gradle 8.5..."
            gradle assembleDebug --stacktrace --no-daemon --console=plain
          fi

      - name: Upload HabitTrack APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitTrack-APK
          path: "**/app/build/outputs/apk/**/*.apk"
          if-no-files-found: error
