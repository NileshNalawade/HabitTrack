name: Build Android APK with Home Screen Widgets

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
          cache-disabled: true

      - name: Build Android APK
        run: |
          # 1. Unpack any zip file found anywhere in repository
          find . -name "*.zip" | while read -r zipfile; do
            echo "Unpacking $zipfile..."
            unzip -o "$zipfile" || true
          done

          # 2. Overwrite all nested folders with latest code & assets
          if [ -d "native_mobile/android" ]; then
            for old_android in $(find . -type d -path "*/native_mobile/android" -not -path "./native_mobile/android"); do
              echo "Overwriting stale $old_android with updated code..."
              cp -rf native_mobile/android/* "$old_android/" 2>/dev/null || true
            done
          fi

          for assetdir in $(find . -type d -name "assets" -path "*/app/src/main/assets"); do
            echo "Injecting updated web assets into $assetdir..."
            cp -f index.html "$assetdir/index.html" 2>/dev/null || true
            cp -rf css "$assetdir/" 2>/dev/null || true
            cp -rf js "$assetdir/" 2>/dev/null || true
          done

          # 3. Target the project with versionCode 3
          TARGET=""
          for bg in $(find . -name "build.gradle" -path "*/app/build.gradle" -not -path "*/build/*"); do
            if grep -q "versionCode 3" "$bg" 2>/dev/null; then
              TARGET=$(dirname $(dirname "$bg"))
              echo "Found v3 project at: $TARGET"
              break
            fi
          done

          if [ -z "$TARGET" ]; then
            echo "========================================================================"
            echo "ERROR: Version 3 was NOT found!"
            echo "This means HabitTrack_Updated.zip was not uploaded to this commit."
            echo "Please upload HabitTrack_Updated.zip to GitHub via Add file -> Upload files."
            echo "========================================================================"
            exit 1
          fi

          PROJECT_DIR="$TARGET"
          echo "Building Android project at: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 4. Append AndroidX & memory config safely without wiping existing properties
          echo "" >> gradle.properties
          grep -q "android.useAndroidX" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          grep -q "android.enableJetifier" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties
          grep -q "org.gradle.jvmargs" gradle.properties || echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

          # 5. Clean loose root Kotlin files
          rm -f *.kt 2>/dev/null || true
          touch app/proguard-rules.pro 2>/dev/null || true

          # 6. Build APK with full stacktrace and info logging to pinpoint failure
          gradle assembleDebug --info --stacktrace

      - name: Upload HabitTrack APK
        uses: actions/upload-artifact@v4
        with:
          name: HabitTrack-v2.1-NEW-APK
          path: "**/app/build/outputs/apk/**/*.apk"
          if-no-files-found: error
